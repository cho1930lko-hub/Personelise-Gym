name: Flutter Android checks

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android/**
  pull_request:
    branches:
      - main
      - android/**
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name personelise_gym .
          fi

      - name: Apply Android SQLCipher and secure-storage settings
        run: bash tool/configure_android_security.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Verify SQLCipher on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd mobile_app && flutter test integration_test/sqlcipher_database_test.dart -d emulator-5554

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personelise-gym-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
