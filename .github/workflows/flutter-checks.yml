name: Flutter Android checks

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android/**
  pull_request:
    branches:
      - main
      - android/**
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for backend security tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Apps Script PBKDF2 implementation
        working-directory: .
        run: node backend/apps_script/tests/pbkdf2.test.cjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name personelise_gym .
          fi

      - name: Apply Android SQLCipher and secure-storage settings
        run: bash tool/configure_android_security.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Verify SQLCipher on Android emulator
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            trap 'echo "--- Emulator diagnostics ---"; adb devices -l || true; adb logcat -d -t 1500 || true' EXIT
            wait_for_android() {
              adb -s emulator-5554 wait-for-device
              for attempt in $(seq 1 60); do
                booted="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$booted" = "1" ] && adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then
                  return 0
                fi
                sleep 2
              done
              echo "Android package manager did not become ready."
              return 1
            }
            wait_for_android
            run_sqlcipher_test() {
              timeout --signal=TERM --kill-after=30s 8m bash -o pipefail -c 'cd mobile_app && flutter test integration_test/sqlcipher_database_test.dart -d emulator-5554 --reporter expanded'
            }
            if ! run_sqlcipher_test; then
              echo "SQLCipher test failed; rebooting emulator and retrying once."
              adb -s emulator-5554 reboot || true
              wait_for_android
              run_sqlcipher_test
            fi

      - name: Build debug APK
        id: build-apk
        if: success()
        run: flutter build apk --debug

      - name: Upload debug APK
        if: success() && steps.build-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: personelise-gym-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
