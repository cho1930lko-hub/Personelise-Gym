name: Flutter Android checks

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android/**
  pull_request:
    branches:
      - main
      - android/**
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name personelise_gym .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personelise-gym-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
