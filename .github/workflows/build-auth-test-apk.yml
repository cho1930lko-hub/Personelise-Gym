name: Build Personelise Gym test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/**

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Apps Script PBKDF2 implementation
        working-directory: .
        run: node backend/apps_script/tests/pbkdf2.test.cjs

      - name: Verify Apps Script authentication security
        working-directory: .
        run: node backend/apps_script/tests/auth_security.test.cjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name personelise_gym .
          fi

      - name: Apply Android SQLCipher and secure-storage settings
        run: bash tool/configure_android_security.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Build test APK with Apps Script auth endpoint
        run: >-
          flutter build apk --debug
          --dart-define=AUTH_API_BASE_URL=https://script.google.com/macros/s/AKfycbwtWSUT4-2nuuctvj05S5ynsVF3gQXQrLyl8-gNOKRw1LBDqYM_Y473UKNUvqQkh9Lv6A/exec

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: personelise-gym-auth-test-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
